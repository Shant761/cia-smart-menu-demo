name: CIA Nutrition Engine — poster-test

on:
  workflow_dispatch:
    inputs:
      restaurant_id:
        description: Firestore restaurant slug
        required: true
        default: poster-test
        type: string
      force:
        description: Recalculate nutrition even when source is unchanged
        required: true
        default: true
        type: boolean

jobs:
  nutrition:
    name: Calculate calories and macros
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CIA_RESTAURANT_ID: ${{ inputs.restaurant_id }}
      NUTRITION_FORCE: ${{ inputs.force }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate nutrition scripts and database
        run: |
          node --check scripts/build-ingredient-catalog.cjs
          node --check scripts/lookup-nutrition-local.cjs
          node --check scripts/calculate-product-nutrition.cjs
          node --check scripts/merge-manual-into-nutrition-database.cjs
          node -e "const db=require('./data/nutrition-database.json'); if(!Array.isArray(db.entries)) throw new Error('Invalid nutrition database')"

      - name: Install Firebase Admin SDK package
        run: npm install --no-save firebase-admin@14.2.0

      - name: Verify Firebase secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT" || (echo 'Missing FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU' && exit 1)

      - name: Merge verified CIA manual nutrition into engine database
        run: node scripts/merge-manual-into-nutrition-database.cjs

      - name: Build CIA ingredient catalog from Poster recipes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
          FORCE_CATALOG_BUILD: ${{ inputs.force }}
        run: node scripts/build-ingredient-catalog.cjs

      - name: Match ingredients against CIA-owned nutrition database
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
        run: node scripts/lookup-nutrition-local.cjs

      - name: Calculate product calories and macros
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
        run: node scripts/calculate-product-nutrition.cjs

      - name: Nutrition pipeline complete
        run: |
          echo "CIA Nutrition Engine completed for restaurant: $CIA_RESTAURANT_ID"
          echo "Result: CIA ingredient nutrition + product calories/macros written to Firestore"
