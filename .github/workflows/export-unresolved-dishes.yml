name: Validate Unresolved Dish Report

# The main nutrition recalculation workflow is the single writer for generated
# nutrition reports. This lightweight workflow only validates the exporter so
# parallel pushes can never race over generated JSON/TXT files.
on:
  push:
    branches:
      - main
    paths:
      - 'scripts/export-unresolved-dish-report.cjs'
      - '.github/workflows/export-unresolved-dishes.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CIA_RESTAURANT_ID: poster-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate exporter
        run: node --check scripts/export-unresolved-dish-report.cjs
