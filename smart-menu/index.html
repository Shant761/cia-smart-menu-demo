<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CIA Smart Menu</title><link rel="stylesheet" href="styles.css"></head><body><main id="app"><header class="header"><div><p class="eyebrow">CIA SMART MENU</p><h1 id="restaurantName">Загрузка…</h1></div><button id="ordersButton" class="orders-button" type="button">Мои заказы</button></header><div class="toolbar"><input id="search" placeholder="Поиск блюд"></div><nav id="categories" class="categories"></nav><p id="count" class="count"></p><section id="products" class="products"></section><p id="error" class="error" hidden></p><p id="success" class="success" hidden></p></main><button id="cartButton" class="cart-button" hidden>Корзина · <span id="cartCount">0</span> · <span id="cartTotal">0 ֏</span></button><div id="cartModal" class="modal" hidden><div class="modal-panel"><div class="modal-header"><h2>Ваш заказ</h2><button id="closeCart" class="close">×</button></div><div id="cartItems" class="cart-items"></div><div class="order-form"><input id="orderName" placeholder="Имя"><input id="orderPhone" type="tel" placeholder="Телефон +374..." required><textarea id="orderComment" placeholder="Комментарий к заказу"></textarea><p id="orderError" class="error" hidden></p><button id="submitOrder" class="submit">Отправить заказ</button></div></div></div><div id="ordersModal" class="modal" hidden><div class="modal-panel"><div class="modal-header"><h2>Мои заказы</h2><button id="closeOrders" class="close" type="button">×</button></div><div id="ordersList" class="cart-items"></div></div></div><script type="module" src="app.js"></script></body></html>
