name: CIA Nutrition - Priority Top 200

on:
  workflow_dispatch:
    inputs:
      restaurant_id:
        description: Firestore restaurant slug
        required: true
        default: poster-test
        type: string
  push:
    paths:
      - 'scripts/build-poster-nutrition-priority-top20.cjs'
      - '.github/workflows/nutrition-priority-top20.yml'

permissions:
  contents: write

jobs:
  build-priority:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase Admin SDK
        run: npm install --no-save firebase-admin@14.2.0

      - name: Build Top 200 from Poster recipe usage
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
          CIA_RESTAURANT_ID: ${{ inputs.restaurant_id || 'poster-test' }}
          CIA_PRIORITY_LIMIT: 200
        run: node scripts/build-poster-nutrition-priority-top20.cjs

      - name: Commit Top 200
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cia-nutrition-priority-top200.json
          if git diff --cached --quiet; then
            echo "No priority list changes."
          else
            git commit -m "chore: update CIA nutrition priority top 200"
            git push
          fi
