name: Sync poster-test and apply menu enrichment

on:
  push:
    paths:
      - '.github/workflows/sync-poster-and-enrich.yml'
      - 'scripts/enrich-ingredient-nutrition-from-usda.cjs'
      - 'scripts/calculate-product-nutrition.cjs'
      - 'data/nutrition-ingredients.json'
  workflow_dispatch:
    inputs:
      restaurant_id:
        description: Firestore restaurant slug (poster-test account)
        required: true
        default: poster-test
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase Admin
        run: npm install firebase-admin@14.2.0

      - name: Sync poster-test and enrich menu
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
          # poster-test only. POSTER_TOKEN is the canonical target name;
          # POSTER_ACCESS_TOKEN remains a legacy fallback until that secret is renamed/added.
          # CIASIFT always uses POSTER_TEST_ACCESS_TOKEN in its own workflows.
          POSTER_ACCESS_TOKEN: ${{ secrets.POSTER_TOKEN || secrets.POSTER_ACCESS_TOKEN }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
          CIA_RESTAURANT_ID: ${{ inputs.restaurant_id || 'poster-test' }}
        run: node scripts/run-poster-sync-and-enrichment.cjs
