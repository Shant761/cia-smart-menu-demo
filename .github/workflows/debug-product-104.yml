name: Debug product 104 ingredients

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/debug-product-ingredients.cjs'
      - '.github/workflows/debug-product-104.yml'

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save firebase-admin@14.2.0
      - name: Read product 104
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
          CIA_RESTAURANT_ID: poster-test
          CIA_PRODUCT_ID: '104'
        run: node scripts/debug-product-ingredients.cjs > debug-product-104.log
      - name: Publish diagnostic
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = `TEMP PRODUCT 104 DIAGNOSTIC\n\n\`\`\`text\n${fs.readFileSync('debug-product-104.log','utf8')}\n\`\`\``;
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100 });
            const prior = issues.find(i => i.title === 'Temporary product 104 diagnostic');
            if (prior) await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: prior.number, body, state: 'open' });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: 'Temporary product 104 diagnostic', body });
