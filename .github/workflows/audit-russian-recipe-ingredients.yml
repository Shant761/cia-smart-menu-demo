name: Audit Russian recipe ingredients

on:
  workflow_dispatch:
    inputs:
      restaurant_id:
        description: Restaurant ID
        required: true
        default: poster-test
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase Admin SDK
        run: npm install --no-save firebase-admin@14.2.0

      - name: Audit
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
          CIA_RESTAURANT_ID: ${{ inputs.restaurant_id }}
        run: node scripts/audit-russian-recipe-ingredients.cjs
