name: Apply ingredient overrides

on:
  workflow_dispatch:
    inputs:
      restaurant_id:
        description: Firestore restaurant slug
        required: true
        default: poster-test
        type: string
  push:
    branches:
      - main
    paths:
      - 'data/*-ingredient-overrides*.json'
      - 'scripts/apply-ingredient-overrides.cjs'
      - 'scripts/enrich-products-from-ingredient-catalog.cjs'
      - 'scripts/apply-admin-reviews.cjs'
      - '.github/workflows/apply-ingredient-overrides.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate override packs
        run: |
          node --check scripts/apply-ingredient-overrides.cjs
          node --check scripts/enrich-products-from-ingredient-catalog.cjs
          node --check scripts/apply-admin-reviews.cjs
          node - <<'NODE'
          const fs = require('fs');
          const files = fs.readdirSync('data').filter(name => /-ingredient-overrides(?:-v\d+)?\.json$/.test(name));
          for (const file of files) JSON.parse(fs.readFileSync(`data/${file}`, 'utf8'));
          console.log(`Override JSON OK: ${files.length} file(s)`);
          NODE

      - name: Install Firebase Admin SDK
        run: npm install --no-save firebase-admin@14.2.0

      - name: Apply overrides and refresh product enrichment
        id: overrides
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
          CIA_RESTAURANT_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.restaurant_id || 'poster-test' }}
        shell: bash
        run: |
          set +e
          : > ingredient-overrides.log
          node scripts/apply-ingredient-overrides.cjs >> ingredient-overrides.log 2>&1
          override_status=$?
          if [ "$override_status" -eq 0 ]; then
            echo "" >> ingredient-overrides.log
            echo "[Pipeline] Refreshing public product ingredients/allergens after overrides..." >> ingredient-overrides.log
            node scripts/enrich-products-from-ingredient-catalog.cjs >> ingredient-overrides.log 2>&1
            enrich_status=$?
          else
            enrich_status=1
          fi
          if [ "$override_status" -eq 0 ] && [ "$enrich_status" -eq 0 ]; then
            echo "" >> ingredient-overrides.log
            echo "[Pipeline] Reapplying restaurant admin allergen decisions..." >> ingredient-overrides.log
            node scripts/apply-admin-reviews.cjs >> ingredient-overrides.log 2>&1
            review_status=$?
          else
            review_status=1
          fi
          cat ingredient-overrides.log
          if [ "$override_status" -ne 0 ] || [ "$enrich_status" -ne 0 ] || [ "$review_status" -ne 0 ]; then exit 1; fi

      - name: Publish override status
        if: always()
        uses: actions/github-script@v7
        env:
          OVERRIDE_OUTCOME: ${{ steps.overrides.outcome }}
        with:
          script: |
            const fs = require('fs');
            const title = 'Ingredient override status';
            const raw = fs.existsSync('ingredient-overrides.log')
              ? fs.readFileSync('ingredient-overrides.log', 'utf8')
              : 'No override log was produced.';
            const success = process.env.OVERRIDE_OUTCOME === 'success';
            const body = `${success ? 'SUCCESS' : 'FAILED'}: Restaurant Ingredient Overrides + Product Refresh\n\nRun: ${context.runId}\n\n\`\`\`text\n${raw.slice(-12000)}\n\`\`\``;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            const prior = issues.find(issue => issue.title === title);
            if (prior) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prior.number,
                body,
                state: success ? 'closed' : 'open'
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Fail after diagnostic
        if: steps.overrides.outcome == 'failure'
        run: exit 1
