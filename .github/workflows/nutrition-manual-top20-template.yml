name: CIA Nutrition - Manual Template

on:
  workflow_dispatch:
    inputs:
      priority_limit:
        description: Existing priority file limit to use
        required: true
        default: 50
        type: number
  push:
    paths:
      - 'data/cia-nutrition-priority-top20.json'
      - 'scripts/build-cia-manual-top20-template.cjs'

permissions:
  contents: write

jobs:
  build-template:
    runs-on: ubuntu-latest
    env:
      CIA_PRIORITY_LIMIT: ${{ inputs.priority_limit || 50 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build manual template
        run: node scripts/build-cia-manual-top20-template.cjs

      - name: Commit template
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cia-nutrition-manual-top20.json
          if git diff --cached --quiet; then
            echo "No manual template changes."
          else
            git commit -m "chore: update CIA manual nutrition template"
            git pull --rebase origin main
            git push
          fi
