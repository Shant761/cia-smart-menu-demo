name: Export Unresolved Dish Report

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/export-unresolved-dish-report.cjs'
      - 'data/poster-test-dish-nutrition-summary.json'
      - '.github/workflows/export-unresolved-dishes.yml'
  workflow_dispatch:

concurrency:
  group: poster-test-nutrition-writes
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CIA_RESTAURANT_ID: poster-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Export unresolved dishes
        run: |
          node --check scripts/export-unresolved-dish-report.cjs
          node scripts/export-unresolved-dish-report.cjs

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/poster-test-unresolved-dishes.json data/poster-test-unresolved-dishes.txt
          if git diff --cached --quiet; then
            echo 'No unresolved dish report changes.'
            exit 0
          fi
          git commit -m 'chore: refresh unresolved dish report'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
