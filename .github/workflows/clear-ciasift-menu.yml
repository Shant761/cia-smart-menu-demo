name: Clear CIASIFT menu

on:
  workflow_dispatch:

jobs:
  clear:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Clear only CIASIFT menu
        run: node scripts/clear-restaurant-menu.cjs ciasift
