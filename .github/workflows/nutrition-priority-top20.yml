name: CIA Nutrition - Priority Top 20

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/cia-nutrition-review.json'
      - 'scripts/build-nutrition-priority-top20.cjs'

permissions:
  contents: write

jobs:
  build-priority:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Top 20
        run: node scripts/build-nutrition-priority-top20.cjs

      - name: Commit Top 20
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cia-nutrition-priority-top20.json
          if git diff --cached --quiet; then
            echo "No priority list changes."
          else
            git commit -m "chore: update CIA nutrition priority top 20"
            git push
          fi
