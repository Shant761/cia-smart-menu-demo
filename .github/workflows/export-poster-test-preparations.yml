name: Export poster-test preparations

on:
  push:
    paths:
      - '.github/workflows/export-poster-test-preparations.yml'
      - 'scripts/export-poster-test-preparations.cjs'
  workflow_dispatch:

concurrency:
  group: poster-test-nutrition-writes
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # poster-test only. Prefer the canonical POSTER_TOKEN secret.
      # POSTER_ACCESS_TOKEN is a temporary legacy fallback until POSTER_TOKEN is added/renamed.
      # CIASIFT uses POSTER_TEST_ACCESS_TOKEN and is never used here.
      POSTER_ACCESS_TOKEN: ${{ secrets.POSTER_TOKEN || secrets.POSTER_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate scripts
        run: |
          node --check scripts/export-poster-test-preparations.cjs
          node --check scripts/calculate-prepack-nutrition.cjs
          node --check scripts/audit-prepack-blockers.cjs

      - name: Verify poster-test token
        run: |
          test -n "$POSTER_ACCESS_TOKEN" || {
            echo 'Missing poster-test secret: add POSTER_TOKEN (or keep legacy POSTER_ACCESS_TOKEN temporarily)'
            exit 1
          }

      - name: Export preparations directly from Poster
        run: node scripts/export-poster-test-preparations.cjs

      - name: Calculate prepack nutrition locally
        run: node scripts/calculate-prepack-nutrition.cjs

      - name: Audit unresolved nutrition blockers
        run: node scripts/audit-prepack-blockers.cjs

      - name: Commit preparation snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/poster-test-preparations.json data/poster-test-prepack-nutrition.json data/poster-test-prepack-blockers.json
          if git diff --cached --quiet; then
            echo 'No preparation changes.'
            exit 0
          fi
          git commit -m 'chore: update poster-test preparations and nutrition'
          git pull --rebase origin main
          git push origin HEAD:main
