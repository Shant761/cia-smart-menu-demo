name: Recalculate Poster Test Dishes With Prepacks

# Re-run preparation and dish nutrition whenever preparation safety rules or source data change.
on:
  push:
    branches:
      - main
    paths:
      - 'scripts/recalculate-snapshot-with-prepacks.cjs'
      - 'scripts/calculate-prepack-nutrition.cjs'
      - 'scripts/audit-prepack-blockers.cjs'
      - 'data/poster-test-preparations.json'
      - 'data/cia-nutrition-manual-top20.json'
      - 'data/cia-nutrition-verified-overrides.json'
      - 'data/cia-nutrition-research-queue.json'
      - '.github/workflows/recalculate-poster-test-dishes-with-prepacks.yml'
  workflow_dispatch:

jobs:
  recalculate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CIA_RESTAURANT_ID: poster-test
      POSTER_ACCESS_TOKEN: ${{ secrets.POSTER_TOKEN || secrets.POSTER_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate nutrition recalculators
        run: |
          node --check scripts/calculate-prepack-nutrition.cjs
          node --check scripts/audit-prepack-blockers.cjs
          node --check scripts/recalculate-snapshot-with-prepacks.cjs

      - name: Verify poster-test token
        run: |
          test -n "$POSTER_ACCESS_TOKEN" || {
            echo 'Missing POSTER_TOKEN / POSTER_ACCESS_TOKEN for poster-test'
            exit 1
          }

      - name: Recalculate preparation nutrition and blockers
        run: |
          node scripts/calculate-prepack-nutrition.cjs
          node scripts/audit-prepack-blockers.cjs

      - name: Recalculate all dish nutrition with prepack tech cards
        run: node scripts/recalculate-snapshot-with-prepacks.cjs

      - name: Inspect Chakapuli and cooked beef consumers
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('data/poster-test-dish-nutrition-summary.json', 'utf8'));
          const rows = (summary.products || []).filter((product) => {
            const names = JSON.stringify(product.name || '').toLowerCase();
            return names.includes('чакапул') || (product.unresolved || []).some((row) => String(row.id) === '529');
          });
          console.log(`[Target dish audit] matches=${rows.length}`);
          for (const product of rows) console.log(JSON.stringify(product, null, 2));
          NODE

      - name: Commit recalculated nutrition snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/poster-test-prepack-nutrition.json \
            data/poster-test-prepack-blockers.json \
            data/public-menus/poster-test.json \
            data/poster-test-dish-nutrition-summary.json
          if git diff --cached --quiet; then
            echo "No nutrition changes."
          else
            git commit -m "chore: recalculate poster-test nutrition snapshots"
            git pull --rebase --autostash origin main
            git push
          fi
