name: CIA Nutrition — Stage 2B Seed Database

on:
  workflow_dispatch:
    inputs:
      restaurant_id:
        description: 'CIA restaurant ID'
        required: true
        default: 'poster-test'
        type: string

permissions:
  contents: write

jobs:
  seed-nutrition-database:
    runs-on: ubuntu-latest
    env:
      CIA_RESTAURANT_ID: ${{ inputs.restaurant_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify review queue
        run: |
          test -f data/nutrition-review-queue.json || {
            echo 'Missing data/nutrition-review-queue.json. Run Stage 2 first.'
            exit 1
          }

      - name: Build CIA nutrition database seed
        run: node scripts/build-cia-nutrition-seed.cjs

      - name: Verify generated database
        run: |
          test -f data/nutrition-database.json
          node -e "const d=require('./data/nutrition-database.json'); if(!Array.isArray(d.entries)) process.exit(1); console.log('Nutrition entries:', d.entries.length);"

      - name: Commit nutrition database
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nutrition-database.json
          if git diff --cached --quiet; then
            echo 'Nutrition database is already up to date.'
          else
            git commit -m "Seed CIA nutrition database from review queue"
            git push
          fi

      - name: Stage 2B complete
        run: echo 'CIA Nutrition Stage 2B seed complete.'
