name: Normalize ingredients with rules

on:
  workflow_dispatch:
    inputs:
      restaurant_id:
        description: Firestore restaurant slug
        required: true
        default: poster-test
        type: string
  push:
    branches:
      - main
    paths:
      - 'data/ingredient-normalization-rules.json'
      - 'scripts/normalize-ingredients-rules.cjs'
      - '.github/workflows/normalize-ingredients-rules.yml'

jobs:
  normalize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate files
        run: |
          node --check scripts/normalize-ingredients-rules.cjs
          node -e "JSON.parse(require('fs').readFileSync('data/ingredient-normalization-rules.json','utf8')); console.log('Rules JSON OK')"

      - name: Install Firebase Admin SDK
        run: npm install --no-save firebase-admin@14.2.0

      - name: Normalize ingredient catalog
        id: rules
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
          CIA_RESTAURANT_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.restaurant_id || 'poster-test' }}
        shell: bash
        run: |
          set +e
          node scripts/normalize-ingredients-rules.cjs > rule-normalizer.log 2>&1
          status=$?
          cat rule-normalizer.log
          exit "$status"

      - name: Publish normalization status
        if: always()
        uses: actions/github-script@v7
        env:
          RULES_OUTCOME: ${{ steps.rules.outcome }}
        with:
          script: |
            const fs = require('fs');
            const title = 'Rule ingredient normalization status';
            const raw = fs.existsSync('rule-normalizer.log')
              ? fs.readFileSync('rule-normalizer.log', 'utf8')
              : 'No rule normalizer log was produced.';
            const safe = raw.slice(-12000);
            const success = process.env.RULES_OUTCOME === 'success';
            const body = `${success ? 'SUCCESS' : 'FAILED'}: Rule Ingredient Normalizer v1\n\nRun: ${context.runId}\n\n\`\`\`text\n${safe}\n\`\`\``;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            const prior = issues.find(issue => issue.title === title);
            if (prior) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prior.number,
                body,
                state: success ? 'closed' : 'open'
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Fail after diagnostic
        if: steps.rules.outcome == 'failure'
        run: exit 1
