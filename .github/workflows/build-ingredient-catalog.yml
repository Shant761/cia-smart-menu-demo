name: Build ingredient catalog

on:
  workflow_dispatch:
    inputs:
      restaurant_id:
        description: Firestore restaurant slug
        required: true
        default: poster-test
        type: string
      force:
        description: Force rebuild even when catalog is already current
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate catalog script syntax
        run: node --check scripts/build-ingredient-catalog.cjs

      - name: Install Firebase Admin SDK
        run: npm install --no-save firebase-admin@14.2.0

      - name: Build catalog
        id: catalog
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
          CIA_RESTAURANT_ID: ${{ inputs.restaurant_id || 'poster-test' }}
          FORCE_CATALOG_BUILD: ${{ inputs.force || false }}
        shell: bash
        run: |
          set +e
          node scripts/build-ingredient-catalog.cjs > ingredient-catalog.log 2>&1
          status=$?
          cat ingredient-catalog.log
          exit "$status"

      - name: Publish catalog status
        if: always()
        uses: actions/github-script@v7
        env:
          CATALOG_OUTCOME: ${{ steps.catalog.outcome }}
        with:
          script: |
            const fs = require('fs');
            const title = 'Ingredient catalog status';
            const raw = fs.existsSync('ingredient-catalog.log')
              ? fs.readFileSync('ingredient-catalog.log', 'utf8')
              : 'No catalog log was produced.';
            const safe = raw.slice(-6000);
            const success = process.env.CATALOG_OUTCOME === 'success';
            const body = `${success ? 'SUCCESS' : 'FAILED'}: Ingredient Catalog v1\n\nRun: ${context.runId}\n\n\`\`\`text\n${safe}\n\`\`\``;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            const prior = issues.find(issue => issue.title === title);

            if (prior) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prior.number,
                body,
                state: success ? 'closed' : 'open'
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Fail after diagnostic
        if: steps.catalog.outcome == 'failure'
        run: exit 1
