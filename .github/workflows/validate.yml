name: Validate Smart Menu

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check admin.js
          node --check customization.js
          node --check firestore-menu-bridge.js
          node --check nutrition-ui-bridge.js
          node --check poster-customization-guard.js
          node --check scripts/apply-admin-reviews.cjs
          node --check scripts/grant-restaurant-admin.cjs
          node --check scripts/apply-ingredient-overrides.cjs
          node --check scripts/enrich-products-from-ingredient-catalog.cjs
          node --check scripts/sync-poster-to-firestore.cjs

      - name: Validate JSON data
        run: |
          python -m json.tool data/products.json > /dev/null
          python -m json.tool data/allergens.json > /dev/null
          python -m json.tool data/ingredient-normalization-rules.json > /dev/null
          for file in data/*-ingredient-overrides*.json data/*-product-translations*.json data/*-category-translations*.json; do
            [ -e "$file" ] || continue
            python -m json.tool "$file" > /dev/null
          done
