name: CIA Nutrition Engine — poster-test

on:
  push:
    branches:
      - main
    paths:
      - 'data/cia-nutrition-priority-top500.json'
      - 'scripts/build-cia-manual-top20-template.cjs'
      - 'scripts/build-poster-nutrition-priority-top20.cjs'
      - 'scripts/build-nutrition-research-queue.cjs'
      - 'scripts/merge-manual-into-nutrition-database.cjs'
      - 'scripts/calculate-product-nutrition.cjs'
      - 'scripts/lookup-nutrition-local.cjs'
      - 'scripts/build-ingredient-catalog.cjs'
      - 'scripts/verify-top20-6-10.cjs'
      - 'scripts/verify-priority-301-400.cjs'
      - 'scripts/verify-priority-401-437.cjs'
      - '.github/workflows/cia-nutrition-engine.yml'
  workflow_dispatch:
    inputs:
      restaurant_id:
        description: Firestore restaurant slug
        required: true
        default: poster-test
        type: string
      sync_firestore:
        description: Sync verified nutrition and product calculations to Firestore
        required: true
        default: false
        type: boolean
      force:
        description: Recalculate nutrition even when result is unchanged
        required: true
        default: false
        type: boolean

jobs:
  nutrition:
    name: Build nutrition database
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CIA_RESTAURANT_ID: ${{ inputs.restaurant_id || 'poster-test' }}
      NUTRITION_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
      CIA_PRIORITY_LIMIT: 500

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate nutrition scripts and database
        run: |
          node --check scripts/verify-top20-6-10.cjs
          node --check scripts/verify-priority-301-400.cjs
          node --check scripts/verify-priority-401-437.cjs
          node --check scripts/build-poster-nutrition-priority-top20.cjs
          node --check scripts/build-cia-manual-top20-template.cjs
          node --check scripts/build-nutrition-research-queue.cjs
          node --check scripts/build-ingredient-catalog.cjs
          node --check scripts/lookup-nutrition-local.cjs
          node --check scripts/calculate-product-nutrition.cjs
          node --check scripts/merge-manual-into-nutrition-database.cjs
          node -e "const db=require('./data/nutrition-database.json'); if(!Array.isArray(db.entries)) throw new Error('Invalid nutrition database')"

      - name: Install Firebase Admin SDK package
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_firestore }}
        run: npm install --no-save firebase-admin@14.2.0

      - name: Verify Firebase secret
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_firestore }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT" || (echo 'Missing FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU' && exit 1)

      - name: Refresh CIA nutrition priority full catalog from Firestore
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_firestore }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
        run: node scripts/build-poster-nutrition-priority-top20.cjs

      - name: Extend CIA manual nutrition to full catalog
        run: node scripts/build-cia-manual-top20-template.cjs

      - name: Apply verified CIA manual nutrition
        run: node scripts/verify-top20-6-10.cjs

      - name: Apply verified nutrition priority 301-400
        run: node scripts/verify-priority-301-400.cjs

      - name: Apply verified nutrition priority 401-437
        run: node scripts/verify-priority-401-437.cjs

      - name: Build CIA nutrition internet research queue
        run: node scripts/build-nutrition-research-queue.cjs

      - name: Merge verified CIA manual nutrition into engine database
        run: node scripts/merge-manual-into-nutrition-database.cjs

      - name: Commit local nutrition database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore package.json package-lock.json || true
          git add data/cia-nutrition-manual-top20.json data/cia-nutrition-priority-top500.json data/cia-nutrition-research-queue.json data/nutrition-database.json
          if git diff --cached --quiet; then
            echo "No local nutrition database changes."
          else
            git commit -m "chore: update CIA nutrition database"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Build CIA ingredient catalog from Poster recipes
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_firestore }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
          FORCE_CATALOG_BUILD: false
        run: node scripts/build-ingredient-catalog.cjs

      - name: Match ingredients against CIA-owned nutrition database
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_firestore }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
        run: node scripts/lookup-nutrition-local.cjs

      - name: Calculate product calories and macros
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_firestore }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
        run: node scripts/calculate-product-nutrition.cjs

      - name: Nutrition pipeline complete
        run: |
          echo "CIA local nutrition database completed for restaurant: $CIA_RESTAURANT_ID"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.sync_firestore }}" = "true" ]; then
            echo "Firestore sync requested and completed."
          else
            echo "Firestore sync skipped; no quota consumed by nutrition Firestore steps."
          fi
