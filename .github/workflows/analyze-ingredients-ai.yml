name: Analyze ingredients with AI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/analyze-ingredients-ai.yml'
  workflow_dispatch:
    inputs:
      restaurant_id:
        description: Firestore restaurant slug
        required: true
        default: poster-test
        type: string
      limit:
        description: Max ingredients to analyze this run
        required: true
        default: '25'
        type: string
      batch_size:
        description: Ingredients per AI request
        required: true
        default: '10'
        type: string
      model:
        description: OpenAI model
        required: true
        default: gpt-5.6
        type: string
      force:
        description: Re-analyze even if already analyzed
        required: true
        default: false
        type: boolean

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate analyzer syntax
        run: node --check scripts/analyze-ingredients-ai.cjs

      - name: Install Firebase Admin SDK
        run: npm install --no-save firebase-admin@14.2.0

      - name: Verify required secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Missing GitHub Actions secret: OPENAI_API_KEY"
            exit 1
          fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing GitHub Actions secret: FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU"
            exit 1
          fi

      - name: Analyze ingredient catalog
        id: ai
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
          CIA_RESTAURANT_ID: ${{ inputs.restaurant_id || 'poster-test' }}
          AI_LIMIT: ${{ inputs.limit || '25' }}
          AI_BATCH_SIZE: ${{ inputs.batch_size || '10' }}
          OPENAI_MODEL: ${{ inputs.model || 'gpt-5.6' }}
          AI_FORCE: ${{ inputs.force || 'false' }}
        shell: bash
        run: |
          set +e
          node scripts/analyze-ingredients-ai.cjs > ai-ingredients.log 2>&1
          status=$?
          cat ai-ingredients.log
          exit "$status"

      - name: Publish safe AI status
        if: always()
        uses: actions/github-script@v7
        env:
          AI_OUTCOME: ${{ steps.ai.outcome }}
        with:
          script: |
            const fs = require('fs');
            const title = 'AI ingredient analysis status';
            const raw = fs.existsSync('ai-ingredients.log')
              ? fs.readFileSync('ai-ingredients.log', 'utf8')
              : 'No analyzer log was produced.';
            const safe = raw.slice(-6000).replace(/sk-[A-Za-z0-9_-]+/g, '[REDACTED_OPENAI_KEY]');
            const success = process.env.AI_OUTCOME === 'success';
            const body = `${success ? 'SUCCESS' : 'FAILED'}: AI Ingredient Analyzer v1\n\nRun: ${context.runId}\n\n\`\`\`text\n${safe}\n\`\`\``;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            const prior = issues.find(issue => issue.title === title);
            if (prior) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prior.number,
                body,
                state: success ? 'closed' : 'open'
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Fail after diagnostic
        if: steps.ai.outcome == 'failure'
        run: exit 1
