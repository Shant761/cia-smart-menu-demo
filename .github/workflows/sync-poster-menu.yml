name: Sync CIASIFT Poster menu to Firestore

on:
  workflow_dispatch:
    inputs:
      restaurant_id:
        description: Firestore restaurant slug for CIASIFT
        required: true
        default: ciasift
        type: string
      restaurant_name:
        description: Restaurant display name
        required: true
        default: CIASIFT
        type: string
      spot_id:
        description: CIASIFT Poster spot ID
        required: false
        default: '1'
        type: string
      sync_recipes:
        description: Load menu.getProduct recipe data
        required: true
        default: false
        type: boolean
      publish_menu:
        description: Make menu publicly readable
        required: true
        default: true
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CIA_RESTAURANT_ID: ${{ inputs.restaurant_id }}
      CIA_RESTAURANT_NAME: ${{ inputs.restaurant_name }}
      POSTER_SPOT_ID: ${{ inputs.spot_id }}
      POSTER_SYNC_RECIPES: ${{ inputs.sync_recipes }}
      CIA_PUBLISH_MENU: ${{ inputs.publish_menu }}
      # CIASIFT only. poster-test uses POSTER_TOKEN in its own workflows.
      POSTER_ACCESS_TOKEN: ${{ secrets.POSTER_TEST_ACCESS_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate sync script
        run: node --check scripts/sync-poster-to-firestore.cjs

      - name: Install Firebase Admin SDK
        run: npm install --no-save firebase-admin@14.2.0

      - name: Verify required secrets
        run: |
          if [ -z "$POSTER_ACCESS_TOKEN" ]; then
            echo "Missing GitHub Actions secret: POSTER_TEST_ACCESS_TOKEN (CIASIFT)"
            exit 1
          fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing GitHub Actions secret: FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU"
            exit 1
          fi

      - name: Sync CIASIFT Poster menu into Firestore
        run: node scripts/sync-poster-to-firestore.cjs
