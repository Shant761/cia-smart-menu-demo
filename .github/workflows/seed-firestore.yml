name: Seed Firestore demo menu

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/seed-firestore.cjs'
      - 'data/products.json'
      - '.github/workflows/seed-firestore.yml'
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase Admin SDK
        run: npm install --no-save firebase-admin@14.2.0

      - name: Seed Firestore
        id: seed
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
        run: node scripts/seed-firestore.cjs

      - name: Publish safe diagnostic issue
        if: steps.seed.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'seed-error.txt';
            const diagnostic = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : JSON.stringify({ message: 'Seed failed before a diagnostic file was produced.' }, null, 2);
            const title = 'Firestore seed diagnostic';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'firestore-seed',
              per_page: 10
            });
            const body = `Automatic Firestore seed failed. Safe diagnostic:\n\n\`\`\`json\n${diagnostic}\n\`\`\`\n\nRun: ${context.runId}`;
            if (existing.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['firestore-seed']
              });
            }

      - name: Fail job after diagnostics
        if: steps.seed.outcome == 'failure'
        run: exit 1
