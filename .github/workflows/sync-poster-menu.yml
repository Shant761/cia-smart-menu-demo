name: Sync Poster menu to Firestore

on:
  workflow_dispatch:
    inputs:
      restaurant_id:
        description: Firestore restaurant slug (letters, numbers, _ or -)
        required: true
        default: poster-demo
        type: string
      restaurant_name:
        description: Restaurant display name used on first sync
        required: true
        default: Poster Restaurant
        type: string
      spot_id:
        description: Poster spot ID; leave blank to use the first visible spot
        required: false
        default: ''
        type: string
      sync_recipes:
        description: Load menu.getProduct for ingredient/tech-card data
        required: true
        default: true
        type: boolean
      publish_menu:
        description: Make this restaurant readable by the public Smart Menu
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-poster-menu.yml'

env:
  CIA_RESTAURANT_ID: ${{ inputs.restaurant_id || 'poster-demo' }}
  CIA_RESTAURANT_NAME: ${{ inputs.restaurant_name || 'Poster Restaurant' }}
  POSTER_SPOT_ID: ${{ inputs.spot_id || '' }}
  POSTER_SYNC_RECIPES: ${{ inputs.sync_recipes == null && 'true' || inputs.sync_recipes }}
  CIA_PUBLISH_MENU: ${{ inputs.publish_menu == null && 'true' || inputs.publish_menu }}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate scripts
        run: |
          node --check scripts/sync-poster-to-firestore.cjs
          node --check scripts/sync-category-translations.cjs
          node --check scripts/build-ingredient-catalog.cjs
          node --check scripts/normalize-ingredients-rules.cjs
          node --check scripts/apply-ingredient-overrides.cjs
          node --check scripts/apply-product-title-translations.cjs
          node --check scripts/enrich-products-from-ingredient-catalog.cjs
          node --check scripts/apply-admin-reviews.cjs
          node -e "JSON.parse(require('fs').readFileSync('data/ingredient-normalization-rules.json','utf8')); console.log('Rules JSON OK')"

      - name: Install Firebase Admin SDK
        run: npm install --no-save firebase-admin@14.2.0

      - name: Verify required secrets
        env:
          POSTER_ACCESS_TOKEN: ${{ secrets.POSTER_ACCESS_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
        run: |
          if [ -z "$POSTER_ACCESS_TOKEN" ]; then
            echo "Missing GitHub Actions secret: POSTER_ACCESS_TOKEN"
            exit 1
          fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing GitHub Actions secret: FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU"
            exit 1
          fi

      - name: Sync Poster menu into Firestore
        env:
          POSTER_ACCESS_TOKEN: ${{ secrets.POSTER_ACCESS_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
        run: node scripts/sync-poster-to-firestore.cjs

      - name: Reapply source-safe category translations
        env:
          POSTER_ACCESS_TOKEN: ${{ secrets.POSTER_ACCESS_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
        run: node scripts/sync-category-translations.cjs

      - name: Build ingredient catalog
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
        run: node scripts/build-ingredient-catalog.cjs

      - name: Normalize ingredients with deterministic rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
        run: node scripts/normalize-ingredients-rules.cjs

      - name: Apply restaurant-specific ingredient overrides
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
        run: node scripts/apply-ingredient-overrides.cjs

      - name: Reapply curated product-title translations
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
        run: node scripts/apply-product-title-translations.cjs

      - name: Enrich product ingredients from normalized catalog
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
        run: node scripts/enrich-products-from-ingredient-catalog.cjs

      - name: Reapply restaurant admin review decisions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIA_SMART_MENU }}
        run: node scripts/apply-admin-reviews.cjs
